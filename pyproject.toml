[project]
name = "cortex"
version = "0.1.0"
description = "Local-first AI-powered personal knowledge capture and retrieval system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5.0",
    "typer[all]>=0.12.0",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "sse-starlette>=2.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cortex = "cortex.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
