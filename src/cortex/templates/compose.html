{% extends "base.html" %}
{% block title %}Compose — Cortex{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="page-title">Compose</h1>
  <p class="page-subtitle">What's on your mind?</p>
</div>

<form id="compose-form" method="post">
  <textarea id="note-text"
            name="raw_text"
            class="compose-textarea"
            placeholder="Start typing... Markdown supported."
            autofocus
            style="min-height: 250px;"></textarea>

  <!-- Options Row -->
  <div class="flex items-center justify-between mt-4" style="flex-wrap: wrap; gap: 12px;">
    <div class="flex items-center gap-4" style="flex-wrap: wrap;">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
        <input type="checkbox" name="is_journal" id="is-journal"
               style="accent-color: var(--accent-gold); width: 16px; height: 16px;">
        Journal mode
      </label>

      {% if collections %}
      <select id="collection-picker"
              style="background: var(--bg-code); color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 0.8rem; font-family: 'Inter', sans-serif; outline: none; cursor: pointer;">
        <option value="">No collection</option>
        {% for col in collections %}
        <option value="{{ col.id }}">{{ col.name }}</option>
        {% endfor %}
      </select>
      {% endif %}
    </div>

    <div class="flex items-center gap-2">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-muted); padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px;">web</span>
      <span id="word-count" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); padding: 8px;">
        0 words
      </span>
      <button type="submit" class="btn btn-primary" id="save-btn">
        Save Note
      </button>
    </div>
  </div>
  <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-muted); margin-top: 8px; opacity: 0.6;">
    <kbd style="background: var(--bg-code); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border);">&#8984;Enter</kbd> to save
  </div>
</form>

<!-- Success Message + Enrichment Display -->
<div id="save-result" style="display: none; margin-top: 20px;"></div>

{% endblock %}

{% block scripts %}
<style>
  .enrichment-spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-gold);
    border-radius: 50%;
    animation: espin 600ms linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes espin { to { transform: rotate(360deg); } }
</style>
<script>
  const textarea = document.getElementById('note-text');
  const wordCount = document.getElementById('word-count');
  const form = document.getElementById('compose-form');
  const saveBtn = document.getElementById('save-btn');
  const saveResult = document.getElementById('save-result');

  // Word count
  textarea.addEventListener('input', () => {
    const words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0).length;
    wordCount.textContent = words + ' word' + (words !== 1 ? 's' : '');
  });

  // Auto-expand textarea
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.max(250, textarea.scrollHeight) + 'px';
  });

  // Cmd+Enter to save
  textarea.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      form.dispatchEvent(new Event('submit'));
    }
  });

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  // Poll for enrichment data after save
  function pollEnrichment(noteId, attempts) {
    if (attempts >= 15) {
      const el = document.getElementById('enrichment-status');
      if (el) el.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-muted);">Enrichment processing in background — check back later.</span>';
      return;
    }
    fetch('/api/notes/' + noteId + '/enrichment')
      .then(r => r.json())
      .then(data => {
        if (!data.enriched) {
          setTimeout(() => pollEnrichment(noteId, attempts + 1), 2000);
          return;
        }
        const el = document.getElementById('enrichment-status');
        if (!el) return;

        let html = '';
        if (data.summary) {
          html += '<div style="margin-bottom: 10px;">';
          html += '<span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Summary</span>';
          html += '<div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">' + escapeHtml(data.summary) + '</div>';
          html += '</div>';
        }
        html += '<div class="flex gap-2 mb-2" style="flex-wrap: wrap;">';
        if (data.category) {
          html += '<span class="category-badge ' + data.category + '">' + data.category + '</span>';
        }
        if (data.sentiment) {
          html += '<span style="font-size: 0.7rem; color: var(--text-muted); padding: 2px 8px; border: 1px solid var(--border); border-radius: 9999px;">' + data.sentiment + '</span>';
        }
        html += '</div>';
        if (data.tags && data.tags.length > 0) {
          html += '<div class="flex gap-2" style="flex-wrap: wrap; margin-top: 8px;">';
          data.tags.forEach(t => {
            html += '<a href="/?tag=' + encodeURIComponent(t.name) + '" class="tag-pill">' + escapeHtml(t.name) + '</a>';
          });
          html += '</div>';
        }
        el.innerHTML = html;
      })
      .catch(() => {
        setTimeout(() => pollEnrichment(noteId, attempts + 1), 2000);
      });
  }

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textarea.value.trim();
    if (!text) return;

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      const payload = {
        raw_text: text,
        source: 'web',
        is_journal: document.getElementById('is-journal').checked
      };
      const colPicker = document.getElementById('collection-picker');
      const collectionId = colPicker ? colPicker.value : '';

      const response = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      saveResult.style.display = 'block';
      saveResult.innerHTML = `
        <div class="note-card fade-in" style="border-color: rgba(201, 168, 76, 0.3);">
          <div style="color: var(--accent-sage); font-size: 0.85rem; margin-bottom: 8px; font-weight: 500;">
            Note saved
          </div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">
            ${data.id ? data.id.slice(0, 8) : ''} &middot; ${data.word_count || 0} words
          </div>
          <div id="enrichment-status" style="padding-top: 8px; border-top: 1px solid var(--border);">
            <span style="font-size: 0.8rem; color: var(--text-muted);"><span class="enrichment-spinner"></span> Extracting metadata...</span>
          </div>
          <div class="flex gap-2 mt-4">
            <a href="/notes/${data.id}" class="btn btn-ghost" style="font-size: 0.8rem;">View Note</a>
            <button class="btn btn-ghost" style="font-size: 0.8rem;" onclick="resetForm()">New Note</button>
          </div>
        </div>
      `;

      if (data.id) {
        pollEnrichment(data.id, 0);
        // Add to collection if selected
        if (collectionId) {
          fetch('/api/collections/' + collectionId + '/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note_id: data.id })
          }).catch(() => {});
        }
      }

      textarea.value = '';
      textarea.style.height = '250px';
      wordCount.textContent = '0 words';
    } catch (err) {
      saveResult.style.display = 'block';
      saveResult.innerHTML = '<div style="color: var(--accent-red);">Error saving note. Please try again.</div>';
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Note';
    }
  });

  function resetForm() {
    saveResult.style.display = 'none';
    textarea.focus();
  }
</script>
{% endblock %}
