{% extends "base.html" %}
{% block title %}Search — Cortex{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="page-title">Search</h1>
  <p class="page-subtitle">Find anything you've ever noted</p>
</div>

<!-- Search Bar -->
<div style="position: relative; margin-bottom: 16px;">
  <input type="text"
         id="search-input"
         class="search-input"
         placeholder="What are you looking for?"
         autocomplete="off"
         autofocus
         hx-get="/partials/search-results"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#results"
         hx-include="#search-mode"
         name="q">
</div>

<!-- Mode Toggle -->
<div class="flex items-center gap-4 mb-6">
  <div class="mode-toggle">
    <input type="radio" name="mode" value="semantic" id="mode-semantic" checked>
    <label for="mode-semantic" class="active" onclick="setMode(this, 'semantic')">Semantic</label>
    <input type="radio" name="mode" value="keyword" id="mode-keyword">
    <label for="mode-keyword" onclick="setMode(this, 'keyword')">Keyword</label>
    <input type="radio" name="mode" value="agent" id="mode-agent">
    <label for="mode-agent" onclick="setMode(this, 'agent')">Agent</label>
  </div>
  <input type="hidden" id="search-mode" name="mode" value="semantic">
</div>

<!-- Results -->
<div id="results"></div>

<!-- Agent Chat Container (shown in agent mode) -->
<div id="agent-container" style="display: none;" class="agent-container">
  <div id="agent-thinking" style="display: none; color: var(--text-muted); font-size: 0.85rem;">
    <span class="agent-spinner"></span> Searching notes and thinking...
  </div>
  <div id="agent-response" class="agent-response"></div>
  <div id="agent-citations" style="margin-top: 16px; display: none;">
    <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;">Sources</div>
    <div id="agent-citation-links" class="flex gap-2" style="flex-wrap: wrap;"></div>
  </div>
  <div id="agent-meta" style="margin-top: 12px; font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;"></div>
</div>

{% endblock %}

{% block scripts %}
<style>
  .agent-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-gold);
    border-radius: 50%;
    animation: spin 600ms linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  let currentMode = 'semantic';
  let agentAbort = null;

  function setMode(el, mode) {
    currentMode = mode;
    document.getElementById('search-mode').value = mode;

    // Update toggle UI
    document.querySelectorAll('.mode-toggle label').forEach(l => l.classList.remove('active'));
    el.classList.add('active');

    // Show/hide containers
    const agentEl = document.getElementById('agent-container');
    const resultsEl = document.getElementById('results');
    agentEl.style.display = mode === 'agent' ? 'block' : 'none';
    resultsEl.style.display = mode === 'agent' ? 'none' : 'block';

    // Re-trigger search if there's a query
    const input = document.getElementById('search-input');
    if (input.value.trim()) {
      if (mode === 'agent') {
        runAgentSearch(input.value);
      } else {
        htmx.trigger(input, 'keyup');
      }
    }
  }

  // Agent search on Enter
  document.getElementById('search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && currentMode === 'agent' && this.value.trim()) {
      e.preventDefault();
      runAgentSearch(this.value);
    }
  });

  function runAgentSearch(query) {
    // Abort any previous request
    if (agentAbort) agentAbort.abort();
    agentAbort = new AbortController();

    const responseEl = document.getElementById('agent-response');
    const thinkingEl = document.getElementById('agent-thinking');
    const citationsEl = document.getElementById('agent-citations');
    const citationLinksEl = document.getElementById('agent-citation-links');
    const metaEl = document.getElementById('agent-meta');

    // Reset UI
    responseEl.textContent = '';
    metaEl.textContent = '';
    citationLinksEl.innerHTML = '';
    citationsEl.style.display = 'none';
    thinkingEl.style.display = 'block';

    document.getElementById('agent-container').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    fetch('/api/search/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, model: 'auto' }),
      signal: agentAbort.signal
    }).then(response => {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let firstToken = true;

      function processLines(text) {
        const lines = text.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const raw = line.slice(5).trim();
          if (!raw || raw === '[DONE]') continue;
          try {
            const data = JSON.parse(raw);

            // Token event — stream text
            if (data.text !== undefined) {
              if (firstToken) {
                thinkingEl.style.display = 'none';
                firstToken = false;
              }
              responseEl.textContent += data.text;
            }

            // Citations event
            if (data.note_ids) {
              citationsEl.style.display = 'block';
              citationLinksEl.innerHTML = data.note_ids.map(id =>
                '<a href="/notes/' + id + '" class="agent-citation">[' + id.slice(0, 8) + ']</a>'
              ).join(' ');
            }

            // Done event
            if (data.model_used !== undefined) {
              metaEl.textContent = data.model_used + ' · ' +
                data.notes_searched + ' notes searched · ' +
                data.notes_cited + ' cited';
              thinkingEl.style.display = 'none';
            }
          } catch(e) { /* skip malformed lines */ }
        }
      }

      function read() {
        reader.read().then(({ done, value }) => {
          if (done) {
            if (buffer) processLines(buffer);
            thinkingEl.style.display = 'none';
            return;
          }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';
          for (const part of parts) processLines(part);
          read();
        }).catch(() => {
          thinkingEl.style.display = 'none';
        });
      }
      read();
    }).catch(err => {
      if (err.name !== 'AbortError') {
        thinkingEl.style.display = 'none';
        responseEl.textContent = 'Error connecting to the agent. Is the server running?';
      }
    });
  }
</script>
{% endblock %}
